<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0A0B0F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tracked" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>Tracked</title>
    <style>
      /* Loading screen. Inline so it paints before the app's code arrives. */
      #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 22px; background: #0a0b0f; transition: opacity 0.45s ease, transform 0.45s ease; }
      #splash::before { content: ''; position: absolute; inset: 0; background: radial-gradient(50% 36% at 50% 46%, rgba(255, 150, 40, 0.16), transparent 70%); }
      #splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
      .splash-mark { position: relative; width: 168px; height: 168px; display: grid; place-content: center; }
      .splash-mark img { width: 76px; height: auto; animation: splash-in 0.6s cubic-bezier(0.22, 1.2, 0.36, 1) both; }
      .splash-mark svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .splash-track { fill: none; stroke: rgba(255, 255, 255, 0.08); stroke-width: 5; }
      .splash-arc { fill: none; stroke: #ffa630; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 120 400; transform-origin: 50% 50%; animation: splash-spin 1.1s linear infinite; }
      .splash-name { position: relative; font: 600 20px/1 'Sora Variable', system-ui, -apple-system, sans-serif; letter-spacing: -0.02em; color: #f4f1ea; }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @keyframes splash-in { from { opacity: 0; transform: scale(0.8); } }
      @media (prefers-reduced-motion: reduce) { .splash-arc, .splash-mark img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading Tracked">
      <div class="splash-mark">
        <svg viewBox="0 0 168 168" aria-hidden="true">
          <circle class="splash-track" cx="84" cy="84" r="78" />
          <circle class="splash-arc" cx="84" cy="84" r="78" />
        </svg>
        <img src="/logo.png" alt="" />
      </div>
      <div class="splash-name">Tracked</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
